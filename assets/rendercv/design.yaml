# RenderCV classic 主题设计配置
# 风格参考：HKUST(GZ) 同学 CV（深蓝 #004F90 + Source Sans 3 + US Letter）
design:
  theme: classic
  page:
    size: us-letter
    show_footer: true
    show_top_note: true
  colors:
    body: "#000000"
    name: "#004F90"
    headline: "#000000"
    connections: "#004F90"
    section_titles: "#004F90"
    links: "#004F90"
    footer: "#808080"
    top_note: "#808080"
  typography:
    font_family: "Source Sans 3"
    font_size:
      body: "10pt"
      section_titles: "1.4em"
    bold:
      section_titles: true
    small_caps:
      section_titles: false
    line_spacing: "0.6em"
    alignment: justified
    date_and_location_column_alignment: right
  section_titles:
    type: with-partial-line
    line_thickness: "0.5pt"
    space_above: "0.5cm"
    space_below: "0.3cm"
  links:
    underline: false
    show_external_link_icon: true
  header:
    connections:
      show_icons: true
