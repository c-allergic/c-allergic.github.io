        company: Caption Evaluation Agent System (HiEval)
        start_date: 2026-04
        end_date: present
        location:
        summary:
        highlights:
          - "Built an LLM-agent-based caption evaluation system that hierarchically explores images from coarse to fine (region tree: ground → subdivide → decompose → match → commit → prune), verifying caption completeness against human-perception-aligned criteria and producing 3-D scores (P/R/F1, attributes, relations) with full decision traces — addressing the bias of surface-level element matching in existing benchmarks"
          - "Automated the evaluation pipeline: produces fine-grained evaluation results and improvement suggestions without manual annotation, improving both efficiency and quality"
          - "Overcame self-validation bias by building an independent grounding stack (GroundingDINO + SAM3 for objects, Mask2Former for background/stuff classes) that provides objective visual evidence"
          - "Validated on four public benchmarks (CapsBench, CompreCap, CAPTURE, PerceptionRubrics) against 4 mainstream models (GPT-5.5, Claude Sonnet 4.5, Qwen3.5, Doubao Seed 2.1), evaluating 6600+ captions"
